name: Deploy API to Azure App Service (legado)

# Portal é front-only (ADR-010). Este workflow não dispara em push.
# Mantido só para eventual App Service legado via execução manual.

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy ASP.NET Core API (legado)
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/api/JsonMais.Web/JsonMais.Web.csproj

      - name: Build
        run: dotnet build src/api/JsonMais.Web/JsonMais.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/api/JsonMais.Web/JsonMais.Web.csproj --configuration Release --output ./publish/api

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: ./publish/api
